server:
  port: 8080

spring:
  application:
    name: chat-service

  # Verbindung zur Datenbank. "postgres" ist KEIN Rechnername, sondern der Dienstname aus
  # docker-compose.yml - den loest der interne DNS von Docker auf. Die Zugangsdaten
  # kommen aus der Umgebung, also aus der .env.
  #
  # Wer den Dienst zum Ausprobieren auf dem Rechner statt im Stack startet, setzt
  # SPRING_DATASOURCE_URL und SPRING_RABBITMQ_HOST als Umgebungsvariablen.
  datasource:
    url: jdbc:postgresql://postgres:5432/${POSTGRES_DB:chat}
    username: ${POSTGRES_USER:chat}
    password: ${POSTGRES_PASSWORD:chat}

  rabbitmq:
    host: rabbitmq
    port: 5672
    username: ${RABBITMQ_DEFAULT_USER:chat}
    password: ${RABBITMQ_DEFAULT_PASS:chat}

# Eigene Einstellungen dieses Dienstes. Die zwei Werte begrenzen die Live-Queue jeder
# Instanz (docs/spec-live-zustellung.md, Abschnitte 3.5 und 4). Es sind Startwerte,
# nicht gemessen: 1000 Nachrichten, 30 Sekunden.
chat-service:
  live-queue:
    max-length: ${LIVE_QUEUE_MAX_LENGTH:1000}
    ttl-ms: ${LIVE_QUEUE_TTL_MS:30000}

# Swagger UI liegt unter http://localhost:8080/swagger-ui.html
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    # Endpunkte nach Reihenfolge im Controller sortieren statt alphabetisch
    operations-sorter: method

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

logging:
  level:
    # Im Unterricht wollen wir jeden Schritt sehen.
    ch.benedict.m321: DEBUG
